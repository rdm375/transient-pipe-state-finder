[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "transient-pipe-state-finder"
version = "0.1.0"
description = "Adjoint-based initial-state estimation for isothermal transient gas pipelines"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
authors = [{name = "Project contributors"}]
dependencies = ["numpy>=1.26", "scipy>=1.12", "jax>=0.4.30"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
